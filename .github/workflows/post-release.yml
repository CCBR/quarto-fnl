name: post-release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Release cleanup only edits metadata; documentation dependencies need not be installed.
    container: nciccbr/ccbr_actions:v0.9.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: CCBR/actions/post-release@v0.9.0
        with:
          github-token: ${{ github.token }}
          version-filepath: DESCRIPTION
          description-filepath: DESCRIPTION
          changelog-filepath: ./CHANGELOG.md
          pr-branch: release/${{ github.event.release.tag_name }}
          update-sliding-tags: false
      - name: Sync both extension versions on the post-release branch
        env:
          PR_BRANCH: release/${{ github.event.release.tag_name }}
        run: |
          git fetch origin "$PR_BRANCH"
          git switch "$PR_BRANCH"
          git merge --ff-only "origin/$PR_BRANCH"
          python3 .github/scripts/sync_extension_version.py
          python3 .github/scripts/sync_extension_version.py --check
          if ! git diff --quiet -- _extensions/fnl/_extension.yml _extensions/fnl-report/_extension.yml; then
            git add _extensions/fnl/_extension.yml _extensions/fnl-report/_extension.yml
            git commit -m "chore: sync extension versions after release"
            git push origin "$PR_BRANCH"
          fi
