name: auto-format

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test version synchronization
        run: python3 -m unittest discover -s tests -v
      - name: Check both extension versions
        run: python3 .github/scripts/sync_extension_version.py --check

  auto-format:
    # Fork and Dependabot PRs cannot use the app token or push to the source branch.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CCBR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CCBR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: Sync both extension versions
        run: python3 .github/scripts/sync_extension_version.py
      - name: Commit and push
        run: |
          if ! git diff --quiet -- _extensions/fnl/_extension.yml _extensions/fnl-report/_extension.yml; then
            git config --local user.name "CCBR-bot"
            git config --local user.email "258092125+ccbr-bot@users.noreply.github.com"
            git add _extensions/fnl/_extension.yml _extensions/fnl-report/_extension.yml
            git commit -m "ci: sync extension versions with DESCRIPTION"
            git push
          fi
